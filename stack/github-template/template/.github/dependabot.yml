# Dependabot version updates (free on every repo).
# Keeps the actions this repo's own workflows use (.github/workflows/check.yml) current.
# Covers the <owner>/.github repo itself; every other repo needs its own copy.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

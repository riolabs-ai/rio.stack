name: Bug
description: Something is broken or behaves differently than documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v1.2.3 or a commit SHA
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, runtime versions, anything relevant. No secrets.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: shell

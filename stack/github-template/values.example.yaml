# Values for one rendering of the GitHub template. Copy this file, fill every key, then:
#   bash render.sh --values my-values.yaml --out ../some/where/.github --apply
# Every key is required. A value you do not have yet should say so in words
# ("TODO: ..."), never be invented. Multi-line values are fine (YAML block scalars).
ORG_NAME: acme                       # GitHub login of the account or org
ACCOUNT_KIND: org                    # org | user (decides where profile/README.md goes)
DISPLAY_NAME: Acme Labs
TAGLINE: Tools that do one thing well.
ABOUT: >-
  Acme Labs builds small, sharp tools and ships them in the open.
FOCUS: |-
  - Developer tooling
  - Automation
  - Docs that stay true
HOME_SCOPE: the products and the tools behind them.
RELATED_ORG: acme-community
RELATED_SCOPE: community projects and examples.
LOCATION: Earth
CONTACT_LINE: Open an issue in the repo you care about, or write to hello@acme.example.
CONTACT_EMAIL: hello@acme.example
SECURITY_EMAIL: security@acme.example
SECURITY_RESPONSE: 5 business days
SUPPORT_LEVEL: best effort
AVATAR_FILE: avatar.png             # file name under profile/assets/
AVATAR_SOURCE: ""                   # optional local path; render.sh copies it to profile/assets/AVATAR_FILE

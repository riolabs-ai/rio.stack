# Hermes profile config — bot-profile template v1
#
# This is a MERGE SOURCE, not a whole config. `install.sh` sets only the keys below and never
# overwrites a value that is already present (unless --force). Every key here was read from a live
# Hermes install; nothing is invented.
#
# Placeholders are written {{LIKE_THIS}}. verify.sh --strict refuses an un-replaced placeholder.

kanban:
  # ---- the ceiling that actually binds -------------------------------------------------
  # max_spawn is read ONCE at boot and short-circuits every other limit. Changing it while the
  # gateway runs changes nothing. The live value is the dispatcher's own log line:
  #   grep "kanban dispatcher: max_spawn" ~/.hermes/logs/gateway.log | tail -1
  # Honest starting point for one 8-core host running per-card builds: 4. Raise only with a
  # measured load average, not an intention.
  max_spawn: 4

  # Checked AFTER max_spawn and cannot raise it. Per-profile stays higher so one busy profile
  # cannot starve the others of the global slots.
  max_in_progress: 4
  max_in_progress_per_profile: 6

  # Attempts before a card gives up and is recorded with its last failure. 3 is enough to
  # distinguish a flake from a wall; more just burns the same wall three times.
  failure_limit: 3

  # The profile that plans and routes. This is the bot this template creates.
  orchestrator_profile: "{{PROFILE}}"
  # The profile that executes. Never the same as the orchestrator: the lead that merges must not
  # be the worker whose work it is reviewing.
  default_assignee: "{{EXECUTOR_PROFILE}}"
  # Only these profiles get dispatched to at all.
  dispatch_profiles: ["{{PROFILE}}", "{{EXECUTOR_PROFILE}}"]

  # Send finished cards to a review column instead of straight to done.
  review_dispatch: true

approvals:
  # How long a gated command waits for a human before the answer is 'no'.
  timeout: 360
  single_query_mode: deny
  discord_prompt_timeout: 900

memory:
  # The built-in stores are the ones that survive a provider outage. An external memory provider
  # is a tool, not the record: if it is unreachable and auto-recall is on, every turn pays for it.
  memory_enabled: true
  user_profile_enabled: true
  # Hard budgets. An over-limit write ERRORS rather than truncating, so keep them honest.
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
  provider: builtin

plugins:
  # A template ships no plugins. Some plugin classes allow only one enabled profile per install
  # (a duplicate is a hard dependency failure), so plugin choice is a per-install decision.
  enabled: []
